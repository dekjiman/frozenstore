services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:?NEXT_PUBLIC_BASE_URL wajib di-set di .env}
        BASE_URL: ${NEXT_PUBLIC_BASE_URL:?NEXT_PUBLIC_BASE_URL wajib di-set di .env}
    ports:
      - "${APP_PORT:-8080}:3000"
    environment:
      DATABASE_URL: postgresql://frozenstore:frozenstore@db:5432/frozenstore
      CART_SESSION_SECRET: ${CART_SESSION_SECRET:?CART_SESSION_SECRET wajib di-set di .env}
      NODE_ENV: production
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:?NEXT_PUBLIC_BASE_URL wajib di-set di .env}
      BASE_URL: ${NEXT_PUBLIC_BASE_URL:?NEXT_PUBLIC_BASE_URL wajib di-set di .env}
      API_URL: http://localhost:3000
      EVOLUTION_BASE_URL: ${EVOLUTION_BASE_URL:-}
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME:-store}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/public/uploads
    restart: unless-stopped
    networks:
      - default
      - evolution-internal

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: frozenstore
      POSTGRES_USER: frozenstore
      POSTGRES_PASSWORD: frozenstore
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frozenstore -d frozenstore"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - default

volumes:
  pgdata:
  uploads_data:

networks:
  evolution-internal:
    external: true
    name: evolution-api_evolution_internal
