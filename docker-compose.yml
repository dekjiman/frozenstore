services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8080}:3000"
    environment:
      DATABASE_URL: postgresql://frozenstore:frozenstore@db:5432/frozenstore
      CART_SESSION_SECRET: ${CART_SESSION_SECRET:-super-secret-change-me-in-production}
      NODE_ENV: production
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:8080}
      BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:8080}
      API_URL: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/public/uploads
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: frozenstore
      POSTGRES_USER: frozenstore
      POSTGRES_PASSWORD: frozenstore
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frozenstore -d frozenstore"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  uploads_data:
